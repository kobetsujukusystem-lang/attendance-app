<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入退室管理</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f6f9; }
    .screen { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    .active { display: block; }
    button { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background-color: #fff; }
    button:disabled { background-color: #e0e0e0; color: #999; cursor: not-allowed; border: none; }
    button.primary { background-color: #4CAF50; color: white; border: none; }
    input[type="text"] { padding: 10px; font-size: 16px; width: 60%; margin-bottom: 10px; }
    
    .seat-map { display: flex; justify-content: center; gap: 20px; margin-top: 20px; padding: 10px; }
    .seat-col { display: flex; flex-direction: column; gap: 5px; }
    .seat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .seat { border: 2px solid #555; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; border-radius: 4px; }
    .seat.used { background-color: #ddd; cursor: not-allowed; color: #aaa; border-color: #aaa; }
    .seat.selected { background-color: #4CAF50; color: white; border-color: #388E3C; }
    #qr-reader { width: 100%; max-width: 400px; margin: 15px auto; display: none; }
    
    .timer-text { font-size: 14px; color: #666; margin-top: 15px; }
    .countdown-number { font-weight: bold; color: #e53935; font-size: 18px; }
  </style>
</head>
<body>

  <!-- ホーム画面 -->
  <div id="home-screen" class="screen active">
    <h2>入退室管理</h2>
    <button class="primary" onclick="startQRScanner()">QRスキャン</button><br><br>
    <div>
      <input type="text" id="student-id" placeholder="IDを入力 (半角英数字)">
      <br><button onclick="login()">ID入力で進む</button>
    </div>
    
    <div id="qr-reader"></div>
    <button id="btn-stop-qr" style="display:none; margin-top:10px;" onclick="stopQRScanner()">カメラを閉じる</button>
    <p id="error-msg" style="color:red; font-weight:bold;"></p>
  </div>

  <!-- アクション選択画面 -->
  <div id="action-screen" class="screen">
    <h2 id="student-name-display"></h2>
    <p style="color: #555;">現在の状態: <span id="current-status-display" style="font-weight:bold;"></span></p>
    
    <button id="btn-enter" onclick="selectAction('入室')">入室</button>
    <button id="btn-leave" onclick="selectAction('退室')">退室</button><br>
    <button id="btn-pause" onclick="selectAction('一時離席')">一時離席</button>
    <button id="btn-return" onclick="selectAction('復帰')">復帰</button><br>
    
    <div id="booth-buttons" style="display:none; margin-top:15px; padding-top:15px; border-top: 1px solid #eee;">
      <button id="btn-booth-start" onclick="showSeatMap()">自習ブース利用開始</button>
      <button id="btn-booth-end" onclick="selectAction('自習ブース利用終了')">自習ブース利用終了</button>
    </div>
    
    <br><br><button onclick="goHome()">キャンセルして戻る</button>
  </div>

  <!-- 座席選択画面 -->
  <div id="seat-screen" class="screen">
    <h3>座席を選択してください</h3>
    <p>3F自習室 座席ブース表</p>
    <div class="seat-map" id="seat-map-container"></div>
    <br>
    <button class="primary" id="confirm-seat-btn" onclick="confirmSeat()" disabled>決定</button>
    <button onclick="showScreen('action-screen')">戻る</button>
  </div>

  <!-- 完了画面 -->
  <div id="completion-screen" class="screen">
    <h2 id="completion-message" style="color: #2e7d32;">処理が完了しました</h2>
    
    <div id="completion-actions" style="margin-top: 25px;">
      <button id="btn-completion-booth" class="primary" style="display:none;" onclick="goToSeatMapFromCompletion()">自習ブースを利用する</button>
      <br id="booth-br" style="display:none;">
      <button onclick="goHome()">ホームに戻る</button>
    </div>

    <p class="timer-text">
      <span class="countdown-number" id="countdown">10</span> 秒後に自動でホーム画面に戻ります
    </p>
  </div>

  <!-- 処理中画面 -->
  <div id="loading-screen" class="screen">
    <h2>通信中...</h2>
    <p>しばらくお待ちください。</p>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <script>
    // ※ここにあなたのGAS WebアプリURL (/exec) を貼り付けます
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxV5qxKYCnb1-4LwKuYqkpj8YFi4d0b9AvEswedr-2XHUav-1a2GxfPGuPCD3a7HqC4Hg/exec";

    let currentStudent = null;
    let selectedSeat = null;
    let usedSeats = [];
    let html5QrcodeScanner = null;
    
    let autoHomeTimer = null;
    let countdownInterval = null;

    // GAS API呼出用の共通関数
    async function callGasApi(data) {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      return await response.json();
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      document.getElementById('error-msg').innerText = '';
    }

    function clearAutoHomeTimer() {
      if (autoHomeTimer) clearTimeout(autoHomeTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      autoHomeTimer = null;
      countdownInterval = null;
    }

    function goHome() {
      clearAutoHomeTimer();
      stopQRScanner();
      document.getElementById('student-id').value = '';
      showScreen('home-screen');
    }

    async function login() {
      const id = document.getElementById('student-id').value;
      if (!id) return;
      showScreen('loading-screen');
      
      try {
        const result = await callGasApi({ actionType: 'checkStudent', inputId: id });
        handleLoginResult(result);
      } catch (err) {
        showScreen('home-screen');
        document.getElementById('error-msg').innerText = '通信エラーが発生しました。';
      }
    }

    function handleLoginResult(result) {
      if (!result.success) {
        showScreen('home-screen');
        document.getElementById('error-msg').innerText = result.error;
        return;
      }
      
      currentStudent = result.data;
      usedSeats = currentStudent.usedSeats || [];
      
      if (currentStudent.hasMessage) {
        alert(currentStudent.message);
      }
      
      setupActionButtons();
      showScreen('action-screen');
    }

    function setupActionButtons() {
      document.getElementById('student-name-display').innerText = currentStudent.name;
      document.getElementById('current-status-display').innerText = currentStudent.currentStatus;
      
      const status = currentStudent.currentStatus;
      
      const btnEnter = document.getElementById('btn-enter');
      const btnLeave = document.getElementById('btn-leave');
      const btnPause = document.getElementById('btn-pause');
      const btnReturn = document.getElementById('btn-return');
      const btnBoothStart = document.getElementById('btn-booth-start');
      const btnBoothEnd = document.getElementById('btn-booth-end');
      
      [btnEnter, btnLeave, btnPause, btnReturn, btnBoothStart, btnBoothEnd].forEach(btn => btn.disabled = true);
      
      if (status === '未入室' || status === '退室') {
        btnEnter.disabled = false;
      } else if (status === '入室' || status === '復帰' || status === '自習ブース利用終了') {
        btnLeave.disabled = false;
        btnPause.disabled = false;
        btnBoothStart.disabled = false;
      } else if (status === '一時離席') {
        btnLeave.disabled = false;
        btnReturn.disabled = false;
      } else if (status === '自習ブース利用開始') {
        btnBoothEnd.disabled = false;
        btnLeave.disabled = false;
      }
      
      const boothDiv = document.getElementById('booth-buttons');
      boothDiv.style.display = currentStudent.canUseBooth ? 'block' : 'none';
    }

    async function selectAction(action) {
      showScreen('loading-screen');
      try {
        await callGasApi({
          actionType: 'recordAction',
          studentName: currentStudent.name,
          action: action,
          seatNumber: null
        });
        showCompletionScreen(action);
      } catch (err) {
        showScreen('action-screen');
        alert('エラーが発生しました。もう一度お試しください。');
      }
    }

    function showCompletionScreen(action) {
      clearAutoHomeTimer();
      
      let msg = action + ' の処理が完了しました。';
      if (action === '自習ブース利用開始' && selectedSeat) {
        msg = '自習ブース利用開始の処理が完了しました。(座席: ' + selectedSeat + '番)';
      }
      document.getElementById('completion-message').innerText = msg;

      const boothBtn = document.getElementById('btn-completion-booth');
      const boothBr = document.getElementById('booth-br');
      if ((action === '入室' || action === '復帰') && currentStudent && currentStudent.canUseBooth) {
        boothBtn.style.display = 'inline-block';
        boothBr.style.display = 'block';
      } else {
        boothBtn.style.display = 'none';
        boothBr.style.display = 'none';
      }

      showScreen('completion-screen');

      let count = 10;
      document.getElementById('countdown').innerText = count;
      
      countdownInterval = setInterval(() => {
        count--;
        document.getElementById('countdown').innerText = count;
        if (count <= 0) {
          clearInterval(countdownInterval);
        }
      }, 1000);

      autoHomeTimer = setTimeout(() => {
        goHome();
      }, 10000);
    }

    function goToSeatMapFromCompletion() {
      clearAutoHomeTimer();
      showSeatMap();
    }

    function showSeatMap() {
      clearAutoHomeTimer();
      selectedSeat = null;
      document.getElementById('confirm-seat-btn').disabled = true;
      renderSeatMap();
      showScreen('seat-screen');
    }

    function renderSeatMap() {
      const container = document.getElementById('seat-map-container');
      container.innerHTML = '';
      
      let block1 = '<div class="seat-col">';
      for(let i=4; i>=1; i--) block1 += createSeat(i);
      block1 += '</div>';
      
      let block2 = '<div class="seat-grid">';
      [5,12,6,11,7,10,8,9].forEach(i => block2 += createSeat(i));
      block2 += '</div>';
      
      let block3 = '<div style="display:flex; flex-direction:column; align-items:center;">';
      block3 += createSeat(13);
      block3 += '<div class="seat-grid">';
      [14,27,15,26,16,25,17,24,18,23,19,22,20,21].forEach(i => block3 += createSeat(i));
      block3 += '</div></div>';
      
      let block4 = '<div class="seat-col">';
      for(let i=28; i<=32; i++) block4 += createSeat(i);
      block4 += '</div>';
      
      container.innerHTML = block1 + block2 + block3 + block4;
    }

    function createSeat(num) {
      const isUsed = usedSeats.includes(num.toString());
      const classStr = isUsed ? 'seat used' : 'seat';
      return `<div class="${classStr}" id="seat-${num}" onclick="selectSeat(${num}, ${isUsed})">${num}</div>`;
    }

    function selectSeat(num, isUsed) {
      if (isUsed) return;
      document.querySelectorAll('.seat').forEach(el => el.classList.remove('selected'));
      selectedSeat = num;
      document.getElementById('seat-' + num).classList.add('selected');
      document.getElementById('confirm-seat-btn').disabled = false;
    }

    async function confirmSeat() {
      if(!selectedSeat) return;
      showScreen('loading-screen');
      try {
        await callGasApi({
          actionType: 'recordAction',
          studentName: currentStudent.name,
          action: '自習ブース利用開始',
          seatNumber: selectedSeat
        });
        showCompletionScreen('自習ブース利用開始');
      } catch (err) {
        showScreen('seat-screen');
        alert('エラーが発生しました。もう一度お試しください。');
      }
    }
    
    // リアルタイムカメラ起動
    function startQRScanner() {
      const qrDiv = document.getElementById('qr-reader');
      qrDiv.style.display = 'block';
      document.getElementById('btn-stop-qr').style.display = 'inline-block';

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { 
          fps: 10, 
          qrbox: { width: 250, height: 250 },
          rememberLastUsedCamera: true
        });
      }
      
      html5QrcodeScanner.render((decodedText) => {
        document.getElementById('student-id').value = decodedText;
        stopQRScanner();
        login();
      });
    }

    function stopQRScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().then(() => {
          document.getElementById('qr-reader').style.display = 'none';
          document.getElementById('btn-stop-qr').style.display = 'none';
        }).catch(() => {
          document.getElementById('qr-reader').style.display = 'none';
          document.getElementById('btn-stop-qr').style.display = 'none';
        });
      }
    }
  </script>
</body>
</html>
